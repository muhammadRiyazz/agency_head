name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Support
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Release Files to ZIP
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows_app_release.zip

      - name: Upload Output File
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: windows_app_release.zip
