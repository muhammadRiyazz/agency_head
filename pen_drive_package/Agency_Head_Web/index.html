<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Student Agency Management Platform for Managers, Office Staff, and Field Executives.">
  <meta name="theme-color" content="#1E3A8A">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agency Head">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Student Agency Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1E3A8A 0%, #0F172A 100%);
      color: #ffffff;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #38BDF8 0%, #1E3A8A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }

    .brand-icon svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0 0 28px 0;
      text-align: center;
    }

    .loading-bar {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #38BDF8, #60A5FA);
      border-radius: 99px;
      animation: loadingSlide 1.4s infinite ease-in-out;
    }

    @keyframes loadingSlide {
      0% {
        left: -45%;
      }
      50% {
        left: 40%;
      }
      100% {
        left: 100%;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
  </style>

  <script>
    // Ensure clean cache during development & updates
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // PWA Install Prompt Handler
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    window.triggerPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then((result) => {
          window.pwaDeferredPrompt = null;
        });
      } else {
        alert('To install this Web App on your computer:\n\n1. In Google Chrome or Microsoft Edge, look at the top address bar on the right.\n2. Click the "Install" or "App Available" icon (a computer monitor with a down arrow).\n3. Click "Install" to place Agency Head on your Desktop and Start menu.');
      }
    };

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('app-loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 400);
      }
    });
  </script>
</head>
<body>
  <div id="app-loading">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="brand-title">Student Agency Manager</h1>
    <div class="brand-subtitle">Agency Head Enterprise App</div>
    <div class="loading-bar"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
